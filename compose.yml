services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-coirnetra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-coirnetra}?schema=public
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - database
    restart: unless-stopped

  website:
    build: ./website
    ports:
      - "5173:5173"
    volumes:
      - ./website:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
