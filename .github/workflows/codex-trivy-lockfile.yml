name: Temporary Trivy lockfile remediation
on:
  push:
    branches:
      - codex/trivy-safe-lock-updates
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Update lockfiles without forcing breaking changes
        shell: bash
        run: |
          for dir in server website; do
            echo "Updating $dir/package-lock.json"
            set +e
            (cd "$dir" && npm audit fix --package-lock-only --ignore-scripts)
            result=$?
            set -e
            echo "npm audit fix exit code for $dir: $result"
          done
      - name: Commit lockfiles only
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo 'No lockfile updates were applied.'
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              server/package-lock.json|website/package-lock.json) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json website/package-lock.json
          git commit -m "fix(deps): update vulnerable lockfiles"
          git push origin HEAD:refs/heads/codex/trivy-safe-lock-updates